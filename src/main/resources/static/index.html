<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Quest</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem;
            margin: 0;
        }
        .container {
             background-color: #313244;
             padding: 2rem;
             border-radius: 12px;
             box-shadow: 0 4px 15px rgba(0,0,0,0.4);
             width: 100%;
             max-width: 450px;
             text-align: center;
         }
        h1 { color: #a6e3a1; margin-bottom: 1.5rem; }
        input, button {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
        }
        input { background-color: #45475a; color: #fff; }
        button { background-color: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #b4befe; }
        #responseLog {
            margin-top: 1rem;
            padding: 10px;
            background: #181825;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            text-align: left;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ Habit Quest ⚔️</h1>
    <h3>Quick User Register</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="registerUser()">Register Account</button>

    <div id="responseLog">API Responses will show here...</div>
</div>

<script>
    async function registerUser() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        const res = await fetch(`/api/auth/register?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`, {
            method: 'POST'
        });
        const data = await res.json();
        document.getElementById('responseLog').textContent = JSON.stringify(data, null, 2);
    }
</script>
</body>
</html>
