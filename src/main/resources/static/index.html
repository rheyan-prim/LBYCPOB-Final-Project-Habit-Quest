<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Quest</title>
    <style>
        /* Base theme and layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
        }
        .container {
            background-color: #313244;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 { color: #a6e3a1; margin-bottom: 1.5rem; }
        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input, select { background-color: #45475a; color: #fff; }
        button { background-color: #89b4fa; color: #11111b; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #b4befe; }

        /* Dashboard UI styles */
        .hidden { display: none !important; }
        .dashboard { width: 100%; max-width: 700px; }
        .hero-banner {
            background: #313244;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .xp-bar-container { background: #181825; height: 18px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .xp-bar-fill { background: linear-gradient(90deg, #a6e3a1, #94e2d5); height: 100%; width: 0%; transition: width 0.3s ease; }
        .quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; width: 100%; }
        .quest-card {
            background-color: #313244;
            border-radius: 10px;
            padding: 15px;
            border-left: 5px solid #89b4fa;
            text-align: left;
        }
        .quest-card.completed { border-left-color: #a6e3a1; opacity: 0.6; }
        .tag { font-size: 0.75rem; background: #45475a; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
<!-- Auth screen -->
<div id="authScreen" class="container">
    <h1>⚔️ Habit Quest ⚔️</h1>
    <h3>Quick User Register</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="authenticate()">Start Game</button>
</div>

<!-- Main dashboard screen -->
<div id="dashboardScreen" class="dashboard hidden">
    <div class="hero-banner">
        <h2 id="heroName">Hero: -</h2>
        <p><strong>Level <span id="heroLevel">1</span></strong> | Total XP: <span id="heroXP">0</span></p>
        <div class="xp-bar-container">
            <div id="xpBar" class="xp-bar-fill"></div>
        </div>
    </div>

    <div class="container" style="max-width: 100%; margin-bottom: 20px;">
        <h3>📜 Add New Quest</h3>
        <input type="text" id="questTitle" placeholder="Quest Title (e.g. Read 10 pages)">
        <input type="text" id="questDesc" placeholder="Description">
        <select id="questType">
            <option value="daily">Daily Quest (Recurring)</option>
            <option value="todo">Epic Quest (One-time To-Do)</option>
        </select>
        <button onclick="createQuest()">Create Quest</button>
    </div>

    <h3 style="text-align: left; width: 100%;">⚔️ Active Quests</h3>
    <div id="questGrid" class="quest-grid"></div>
</div>
<script>
    let currentUser = null;

    // Authenticate user
    async function authenticate() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (!user || !pass) return alert("Please enter username and password!");

        const res = await fetch(`/api/auth/register?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`, {
            method: 'POST'
        });
        currentUser = await res.json();

        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');

        updateUI();
        loadQuests();
    }

    // Update stats and XP bar
    function updateUI() {
        document.getElementById('heroName').innerText = `Hero: ${currentUser.username}`;
        document.getElementById('heroLevel').innerText = currentUser.currentLevel;
        document.getElementById('heroXP').innerText = currentUser.totalXP;

        const currentLevelXP = currentUser.totalXP % 100;
        document.getElementById('xpBar').style.width = `${currentLevelXP}%`;
    }

    // Create new quest
    async function createQuest() {
        const title = document.getElementById('questTitle').value;
        const desc = document.getElementById('questDesc').value;
        const type = document.getElementById('questType').value;
        if (!title) return alert("Title required!");

        await fetch(`/api/habits/${type}?userId=${currentUser.id}&title=${encodeURIComponent(title)}&description=${encodeURIComponent(desc)}`, {
            method: 'POST'
        });

        document.getElementById('questTitle').value = '';
        document.getElementById('questDesc').value = '';
        loadQuests();
    }

    // Fetch and display active quests
    async function loadQuests() {
        const res = await fetch(`/api/habits?userId=${currentUser.id}`);
        const habits = await res.json();

        const grid = document.getElementById('questGrid');
        grid.innerHTML = '';

        habits.forEach(h => {
            const card = document.createElement('div');
            card.className = `quest-card ${h.completionStatus ? 'completed' : ''}`;
            card.innerHTML = `
                <span class="tag">${h.completionStatus ? 'COMPLETED' : 'ACTIVE'}</span>
                <h4 style="margin: 8px 0;">${h.title}</h4>
                <p style="font-size: 0.9rem; color: #a6adc8; margin: 4px 0;">${h.description || ''}</p>
                <p style="font-size: 0.85rem; margin: 8px 0;">🔥 Streak: ${h.streakCount || 0}</p>
                ${!h.completionStatus ? `<button onclick="completeQuest(${h.id})">Complete (+XP)</button>` : ''}
            `;
            grid.appendChild(card);
        });
    }

    // Complete quest and grant XP
    async function completeQuest(habitId) {
        const res = await fetch(`/api/habits/${habitId}/complete?userId=${currentUser.id}`, {
            method: 'POST'
        });
        currentUser = await res.json();
        updateUI();
        loadQuests();
    }
</script>
</body>
</html>
