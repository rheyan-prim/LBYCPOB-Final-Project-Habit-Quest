<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Quest</title>
    <style>
        :root {
            --bg-main: #0f0f17;
            --card-bg: #1e1e2e;
            --card-border: #313244;
            --accent-green: #a6e3a1;
            --accent-blue: #89b4fa;
            --accent-purple: #cba6f7;
            --accent-pink: #f38ba8;
            --text-primary: #cdd6f4;
            --text-secondary: #a6adc8;
            --input-bg: #181825;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, #1e1e2e 0%, #0f0f17 75%);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
            margin: 0;
            min-height: 100vh;
        }

        /* Container Card Base */
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
        }

        h1 { color: var(--accent-green); margin: 0 0 0.5rem 0; font-size: 1.8rem; text-align: center; }
        h3 { color: var(--text-primary); margin-top: 0; text-align: center; font-weight: 600; }

        /* Inputs and Buttons */
        input, select, button {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input, select {
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(137, 180, 250, 0.15);
        }

        button {
            background-color: var(--accent-blue);
            color: #11111b;
            font-weight: 700;
            cursor: pointer;
            border: none;
            margin-top: 12px;
        }

        button:hover {
            background-color: #b4befe;
            transform: translateY(-1px);
        }

        .logout-btn {
            background-color: rgba(243, 139, 168, 0.15);
            color: var(--accent-pink);
            border: 1px solid var(--accent-pink);
            width: auto;
            padding: 6px 14px;
            margin: 0;
            font-size: 0.85rem;
        }

        .logout-btn:hover {
            background-color: var(--accent-pink);
            color: #11111b;
        }

        /* Layout & Dashboard */
        .hidden { display: none !important; }
        .dashboard { width: 100%; max-width: 720px; }

        .hero-banner {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .xp-bar-container {
            background: var(--input-bg);
            height: 14px;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 12px;
            border: 1px solid var(--card-border);
        }

        .xp-bar-fill {
            background: linear-gradient(90deg, var(--accent-green), #94e2d5);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
        }

        /* Quest Cards Grid */
        .quest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .quest-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--accent-blue);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .quest-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .quest-card.completed {
            border-left-color: var(--accent-green);
            opacity: 0.65;
        }

        .quest-card h4 {
            margin: 8px 0;
            color: var(--text-primary);
        }

        .quest-card.completed h4 {
            text-decoration: line-through;
        }

        .tag {
            font-size: 0.7rem;
            font-weight: 700;
            background: var(--input-bg);
            color: var(--accent-blue);
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            width: fit-content;
        }

        .quest-card.completed .tag {
            color: var(--accent-green);
        }
    </style>
</head>
<body>
<!-- Auth screen -->
<div id="authScreen" class="container">
    <h1>⚔️ Habit Quest ⚔️</h1>
    <h3>Quick User Register</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="authenticate()">Start Game</button>
</div>

<!-- Main dashboard screen -->
<div id="dashboardScreen" class="dashboard hidden">
    <div class="hero-banner">
        <h2 id="heroName">Hero: -</h2>
        <p><strong>Level <span id="heroLevel">1</span></strong> | Total XP: <span id="heroXP">0</span></p>
        <div class="xp-bar-container">
            <div id="xpBar" class="xp-bar-fill"></div>
        </div>
    </div>

    <div class="container" style="max-width: 100%; margin-bottom: 20px;">
        <h3>📜 Add New Quest</h3>
        <input type="text" id="questTitle" placeholder="Quest Title (e.g. Read 10 pages)">
        <input type="text" id="questDesc" placeholder="Description">
        <select id="questType">
            <option value="daily">Daily Quest (Recurring)</option>
            <option value="todo">Epic Quest (One-time To-Do)</option>
        </select>
        <button onclick="createQuest()">Create Quest</button>
    </div>

    <h3 style="text-align: left; width: 100%;">⚔️ Active Quests</h3>
    <div id="questGrid" class="quest-grid"></div>
</div>
<script>
    let currentUser = null;

    // Authenticate user
    async function authenticate() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (!user || !pass) return alert("Please enter username and password!");

        const res = await fetch(`/api/auth/register?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`, {
            method: 'POST'
        });
        currentUser = await res.json();

        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');

        updateUI();
        loadQuests();
    }

    // Update stats and XP bar
    function updateUI() {
        document.getElementById('heroName').innerText = `Hero: ${currentUser.username}`;
        document.getElementById('heroLevel').innerText = currentUser.currentLevel;
        document.getElementById('heroXP').innerText = currentUser.totalXP;

        const currentLevelXP = currentUser.totalXP % 100;
        document.getElementById('xpBar').style.width = `${currentLevelXP}%`;
    }

    // Create new quest
    async function createQuest() {
        const title = document.getElementById('questTitle').value;
        const desc = document.getElementById('questDesc').value;
        const type = document.getElementById('questType').value;
        if (!title) return alert("Title required!");

        await fetch(`/api/habits/${type}?userId=${currentUser.id}&title=${encodeURIComponent(title)}&description=${encodeURIComponent(desc)}`, {
            method: 'POST'
        });

        document.getElementById('questTitle').value = '';
        document.getElementById('questDesc').value = '';
        loadQuests();
    }

    // Fetch and display active quests
    async function loadQuests() {
        const res = await fetch(`/api/habits?userId=${currentUser.id}`);
        const habits = await res.json();

        const grid = document.getElementById('questGrid');
        grid.innerHTML = '';

        habits.forEach(h => {
            const card = document.createElement('div');
            card.className = `quest-card ${h.completionStatus ? 'completed' : ''}`;
            card.innerHTML = `
                <span class="tag">${h.completionStatus ? 'COMPLETED' : 'ACTIVE'}</span>
                <h4 style="margin: 8px 0;">${h.title}</h4>
                <p style="font-size: 0.9rem; color: #a6adc8; margin: 4px 0;">${h.description || ''}</p>
                <p style="font-size: 0.85rem; margin: 8px 0;">🔥 Streak: ${h.streakCount || 0}</p>
                ${!h.completionStatus ? `<button onclick="completeQuest(${h.id})">Complete (+XP)</button>` : ''}
            `;
            grid.appendChild(card);
        });
    }

    // Complete quest and grant XP
    async function completeQuest(habitId) {
        const res = await fetch(`/api/habits/${habitId}/complete?userId=${currentUser.id}`, {
            method: 'POST'
        });
        currentUser = await res.json();
        updateUI();
        loadQuests();
    }
</script>
</body>
</html>
