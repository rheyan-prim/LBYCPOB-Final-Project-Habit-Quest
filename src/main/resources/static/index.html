<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Quest</title>
    <style>
        input, select, button { box-sizing: border-box; }
        select { background-color: #45475a; color: #fff; }

        .hidden { display: none !important; }
        .dashboard { width: 100%; max-width: 700px; }
        .hero-banner {
            background: #313244;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .xp-bar-container { background: #181825; height: 18px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .xp-bar-fill { background: linear-gradient(90deg, #a6e3a1, #94e2d5); height: 100%; width: 0%; transition: width 0.3s ease; }
        .quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; width: 100%; }
        .quest-card {
            background-color: #313244;
            border-radius: 10px;
            padding: 15px;
            border-left: 5px solid #89b4fa;
            text-align: left;
        }
        .quest-card.completed { border-left-color: #a6e3a1; opacity: 0.6; }
        .tag { font-size: 0.75rem; background: #45475a; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ Habit Quest ⚔️</h1>
    <h3>Quick User Register</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="registerUser()">Register Account</button>

    <div id="responseLog">API Responses will show here...</div>
</div>

<script>
    async function registerUser() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        const res = await fetch(`/api/auth/register?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`, {
            method: 'POST'
        });
        const data = await res.json();
        document.getElementById('responseLog').textContent = JSON.stringify(data, null, 2);
    }
</script>
</body>
</html>
